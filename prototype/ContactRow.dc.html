<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>ردیف تماس</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.ContactRow_cr{display:flex;align-items:center;gap:12px;min-height:72px;padding:12px 16px;background:var(--sf,#fff);border-radius:20px;box-shadow:0 4px 16px rgba(31,26,23,.06);text-decoration:none;font-family:'Yekan Bakh',Tahoma,sans-serif;color:var(--ink,#1F1A17)}
.ContactRow_ib{width:48px;height:48px;border-radius:50%;background:var(--soft,#FCE3D0);display:grid;place-items:center;flex:none}
.ContactRow_ib svg{width:32px;height:32px}
.ContactRow_tx{flex:1;min-width:0}.ContactRow_tx b{display:block;font-size:14px;font-weight:700;line-height:1.7}.ContactRow_tx small{display:block;font-size:12px;color:var(--mu,#7A6E66);line-height:1.6}
.ContactRow_call{width:48px;height:48px;border-radius:50%;background:#E4501E;color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 8px 24px rgba(228,80,30,.25);transition:transform .2s ease-out}
.ContactRow_cr:hover .ContactRow_call{transform:scale(1.08) rotate(-8deg)}.ContactRow_cr:focus-visible{outline:3px solid #E4501E;outline-offset:2px}.ContactRow_ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<a class="ContactRow_cr" dir="rtl" href="{{ href }}" aria-label="تماس با {{ title }}"><span class="ContactRow_ib"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#{{ art }}"></use></svg></span><span class="ContactRow_tx"><b>{{ title }}</b><small>{{ sub }}</small></span><span class="ContactRow_call"><svg class="ContactRow_ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg></span></a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title": {"editor": null}, "sub": {"editor": null}, "art": {"editor": null}, "href": {"editor": null}, "$preview": {"width": 358, "height": 96}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
return { title: P.title ?? '', sub: P.sub ?? '', art: P.art ?? 'dk-all', href: P.href ?? '#' };
}
}
</script>
</body>
</html>
