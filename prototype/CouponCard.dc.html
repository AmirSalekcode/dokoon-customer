<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>کارت کد تخفیف</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.CouponCard_c{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;background:var(--sf,#fff);border-radius:20px;box-shadow:0 4px 16px rgba(31,26,23,.06);font-family:'Yekan Bakh',Tahoma,sans-serif;color:var(--ink,#1F1A17)}
.CouponCard_pc{width:64px;height:64px;border-radius:20px;background:var(--soft,#FCE3D0);color:var(--pr2,#C2410C);display:grid;place-items:center;flex:none;font-size:20px;font-weight:800}
.CouponCard_tx{flex:1;min-width:0}.CouponCard_t{font-size:14px;font-weight:700;line-height:1.6}.CouponCard_s{font-size:12px;color:var(--mu,#7A6E66);line-height:1.7}
.CouponCard_cd{display:inline-block;margin-top:4px;padding:0 8px;border:1.5px dashed #E4501E;border-radius:12px;font-size:12px;font-weight:700;color:var(--pr2,#C2410C);direction:ltr;line-height:1.8}
.CouponCard_b{flex:none;min-height:40px;padding:0 16px;border:0;border-radius:999px;background:#E4501E;color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}.CouponCard_b:hover{background:#C2410C}.CouponCard_b:focus-visible{outline:3px solid #E4501E;outline-offset:2px}
</style>
</helmet>
<div class="CouponCard_c" dir="rtl"><span class="CouponCard_pc">{{ badge }}</span><span class="CouponCard_tx"><div class="CouponCard_t">{{ title }}</div><div class="CouponCard_s">{{ sub }}</div><span class="CouponCard_cd">{{ code }}</span></span><button class="CouponCard_b" onClick="{{ use }}">{{ cta }}</button></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"badge": {"editor": null}, "title": {"editor": null}, "sub": {"editor": null}, "code": {"editor": null}, "cta": {"editor": null}, "onUse": {"editor": null}, "$preview": {"width": 358, "height": 100}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
return { badge: P.badge ?? '', title: P.title ?? '', sub: P.sub ?? '', code: P.code ?? '', cta: P.cta ?? 'استفاده', use: (e) => { if (P.onUse) P.onUse(); } };
}
}
</script>
</body>
</html>
