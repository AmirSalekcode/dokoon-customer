<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>دسته‌بندی</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.CategoryItem_ci{display:flex;flex-direction:column;align-items:center;gap:8px;width:72px;border:0;background:none;padding:0;cursor:pointer;font-family:'Yekan Bakh',Tahoma,sans-serif;font-size:12px;font-weight:400;line-height:1.6;color:var(--ink,#1F1A17)}.CategoryItem_ci:focus-visible{outline:3px solid #E4501E;outline-offset:4px;border-radius:12px}.CategoryItem_cc{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:var(--sf,#fff);box-shadow:0 4px 16px rgba(31,26,23,.06);padding:12px;transition:background .2s ease-out,transform .25s ease-out}.CategoryItem_ci:hover .CategoryItem_cc{transform:translateY(-4px) scale(1.06)}.CategoryItem_ci.CategoryItem__on .CategoryItem_cc{background:var(--soft,#FCE3D0)}.CategoryItem_ci.CategoryItem__on{font-weight:700;color:var(--pr2,#C2410C)}.CategoryItem_cc svg{width:100%;height:100%;display:block;animation:bob 3.4s ease-in-out infinite}
</style>
</helmet>
<button class="CategoryItem_ci {{ cls }}" dir="rtl" aria-pressed="{{ selected }}" onClick="{{ pick }}"><span class="CategoryItem_cc"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#{{ art }}"></use></svg></span><span>{{ title }}</span></button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title": {"editor": null}, "art": {"editor": null}, "selected": {"editor": null}, "onPick": {"editor": null}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
return { title: P.title ?? '', art: P.art ?? '', selected: !!P.selected, cls: P.selected ? 'CategoryItem__on' : '', pick: (e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); if(P.onPick) P.onPick(); } };
}
}
</script>
</body>
</html>
