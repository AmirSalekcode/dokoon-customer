<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>ثبت نظر</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.ReviewSheet_sh{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:var(--bg,#FBF0E6);border-radius:28px 28px 0 0;box-shadow:0 -12px 32px rgba(0,0,0,.25);padding:8px 16px 16px;animation:slideU .5s cubic-bezier(.2,.8,.2,1) both;font-family:'Yekan Bakh',Tahoma,sans-serif;color:var(--ink,#1F1A17)}
.ReviewSheet_hl{display:block;width:48px;height:4px;border-radius:99px;background:var(--ln,#F0DFD0);margin:0 auto 12px}
.ReviewSheet_hd{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ReviewSheet_hd h2{margin:0;font-size:20px;font-weight:700;line-height:1.4}
.ReviewSheet_hd small{display:block;font-size:12px;color:var(--mu,#7A6E66);font-weight:400;line-height:1.6}
.ReviewSheet_x{width:48px;height:48px;border:0;border-radius:50%;background:var(--sf,#fff);box-shadow:0 4px 16px rgba(31,26,23,.12);display:grid;place-items:center;cursor:pointer;color:var(--ink,#1F1A17);padding:0;flex:none}
.ReviewSheet_x svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.ReviewSheet_st{display:flex;justify-content:center;gap:8px;margin:20px 0 4px;direction:ltr}
.ReviewSheet_s{width:48px;height:48px;border:0;background:none;padding:0;cursor:pointer;transition:transform .2s ease-out}
.ReviewSheet_s:hover{transform:scale(1.15)}
.ReviewSheet_s svg{width:100%;height:100%;fill:var(--ln,#F0DFD0);stroke:var(--ln,#F0DFD0);stroke-width:1;stroke-linejoin:round;transition:fill .2s ease-out,stroke .2s ease-out}
.ReviewSheet_s.ReviewSheet__on svg{fill:#F5B32F;stroke:#F5B32F;animation:pop .3s ease-out}
.ReviewSheet_s:focus-visible,.ReviewSheet_ok:focus-visible{outline:3px solid #E4501E;outline-offset:2px}
.ReviewSheet_lb{text-align:center;font-size:14px;font-weight:700;color:var(--pr2,#C2410C);min-height:24px;line-height:1.7}
.ReviewSheet_nt{width:100%;height:96px;margin-top:12px;border:1.5px solid var(--ln,#F0DFD0);border-radius:20px;background:var(--sf,#fff);padding:12px 16px;font-family:inherit;font-size:14px;line-height:1.7;resize:none;color:var(--ink,#1F1A17)}
.ReviewSheet_nt:focus{outline:3px solid #E4501E}
.ReviewSheet_ok{width:100%;height:56px;margin-top:16px;border:0;border-radius:999px;background:#E4501E;color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(228,80,30,.25);transition:transform .2s ease-out}
.ReviewSheet_ok:hover{transform:scale(1.02)}.ReviewSheet_ok:disabled{background:var(--ln,#F0DFD0);color:var(--mu,#7A6E66);box-shadow:none;cursor:not-allowed}
</style>
</helmet>
<div class="ReviewSheet_sh" dir="rtl" role="dialog" aria-label="ثبت نظر"><i class="ReviewSheet_hl"></i><div class="ReviewSheet_hd"><div><h2>ثبت نظر شما</h2><small>{{ foodName }}</small></div><button class="ReviewSheet_x" aria-label="بستن" onClick="{{ close }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div><div class="ReviewSheet_st"><sc-for list="{{ starItems }}" as="s" hint-placeholder-count="5"><button class="ReviewSheet_s {{ s.cls }}" aria-label="{{ s.label }}" onClick="{{ s.pick }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.7 19.8l1.1-6.1L3.3 9.4l6.1-.8z"></path></svg></button></sc-for></div><div class="ReviewSheet_lb">{{ starLabel }}</div><textarea class="ReviewSheet_nt" placeholder="تجربه‌ی خود را از این غذا بنویسید (اختیاری)" value="{{ text }}" onInput="{{ input }}"></textarea><button class="ReviewSheet_ok" disabled="{{ notOk }}" onClick="{{ submit }}">ثبت نظر</button></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"foodName": {"editor": null}, "starItems": {"editor": null}, "starLabel": {"editor": null}, "text": {"editor": null}, "canSubmit": {"editor": null}, "onText": {"editor": null}, "onSubmit": {"editor": null}, "onClose": {"editor": null}, "$preview": {"width": 390, "height": 420}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
return { foodName: P.foodName ?? '', starItems: P.starItems || [], starLabel: P.starLabel ?? '', text: P.text ?? '', notOk: !P.canSubmit, close: (e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); if(P.onClose) P.onClose(); }, submit: (e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); if(P.onSubmit) P.onSubmit(); }, input: (e) => { if (P.onText) P.onText(e && e.target ? e.target.value : ''); } };
}
}
</script>
</body>
</html>
