<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>منوی همبرگری</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.MenuDrawer_dr{position:absolute;top:0;right:0;bottom:0;width:86%;display:flex;flex-direction:column;background:var(--bg,#FBF0E6);border-radius:28px 0 0 28px;box-shadow:-12px 0 32px rgba(0,0,0,.25);animation:slideR .55s cubic-bezier(.2,.8,.2,1) both;font-family:'Yekan Bakh',Tahoma,sans-serif;color:var(--ink,#1F1A17)}.MenuDrawer_x{position:absolute;top:16px;left:16px;width:48px;height:48px;border:0;border-radius:50%;background:var(--sf,#fff);box-shadow:0 4px 16px rgba(31,26,23,.12);display:grid;place-items:center;cursor:pointer;color:var(--ink,#1F1A17);padding:0;transition:transform .2s ease-out}.MenuDrawer_x:hover{transform:rotate(90deg)}.MenuDrawer_x:focus-visible,.MenuDrawer_it:focus-visible{outline:3px solid #E4501E;outline-offset:2px}.MenuDrawer_pf{display:flex;align-items:center;gap:12px;padding:32px 16px 16px}.MenuDrawer_av{width:56px;height:56px;border-radius:50%;background:var(--soft,#FCE3D0);color:var(--pr2,#C2410C);font-size:24px;font-weight:800;display:grid;place-items:center;flex:none;box-shadow:0 0 0 3px var(--sf,#fff),0 0 0 5px #E4501E}.MenuDrawer_pf h2{margin:0;font-size:16px;font-weight:700;line-height:1.5}.MenuDrawer_pf p{margin:0;font-size:12px;color:var(--mu,#7A6E66);direction:ltr;text-align:right;line-height:1.6}.MenuDrawer_md{flex:1;overflow-y:auto;padding:0 16px 8px;scrollbar-width:none}.MenuDrawer_md::-webkit-scrollbar{display:none}.MenuDrawer_cy{display:flex;align-items:center;gap:12px;background:var(--sf,#fff);border-radius:20px;padding:12px;box-shadow:0 4px 16px rgba(31,26,23,.06)}.MenuDrawer_ib{width:40px;height:40px;border-radius:12px;background:var(--soft,#FCE3D0);color:var(--pr2,#C2410C);display:grid;place-items:center;flex:none;transition:transform .25s ease-out}.MenuDrawer_cy .MenuDrawer_ib{background:#E4501E;color:#fff}.MenuDrawer_cy small{display:block;font-size:12px;color:var(--mu,#7A6E66);line-height:1.6}.MenuDrawer_cy b{font-size:16px;font-weight:700}.MenuDrawer_gp{background:var(--sf,#fff);border-radius:20px;padding:4px;margin-top:12px;box-shadow:0 4px 16px rgba(31,26,23,.06)}.MenuDrawer_it{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:4px 8px;border:0;border-radius:12px;background:none;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink,#1F1A17);text-align:right;transition:background .2s ease-out}.MenuDrawer_it:hover{background:var(--soft,#FCE3D0)}.MenuDrawer_it:hover .MenuDrawer_ib{transform:rotate(-8deg) scale(1.08)}.MenuDrawer_it .MenuDrawer_lb{flex:1}.MenuDrawer_bg2{font-size:12px;font-weight:700;color:#fff;background:#E4501E;border-radius:999px;padding:0 8px;line-height:1.8;animation:pulse 2.4s ease-in-out infinite}.MenuDrawer_it .MenuDrawer_cv{color:var(--mu,#7A6E66)}.MenuDrawer_ft{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 16px 24px;border-top:1px solid var(--ln,#F0DFD0)}.MenuDrawer_ft svg.MenuDrawer_lg{height:28px;width:auto;display:block;animation:bob 4s ease-in-out infinite}.MenuDrawer_ft small{font-size:12px;color:var(--mu,#7A6E66)}.MenuDrawer__out{color:#DC2626}.MenuDrawer__out .MenuDrawer_ib{background:var(--sf,#fff);color:#DC2626}.MenuDrawer_ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<aside class="MenuDrawer_dr" dir="rtl" aria-label="منو"><button class="MenuDrawer_x" aria-label="بستن منو" onClick="{{ close }}"><svg class="MenuDrawer_ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button><div class="MenuDrawer_pf"><span class="MenuDrawer_av">{{ initial }}</span><div><h2>سلام {{ name }} عزیز</h2><p>{{ phone }}</p></div></div><div class="MenuDrawer_md"><div class="MenuDrawer_cy"><span class="MenuDrawer_ib"><svg class="MenuDrawer_ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11zM12 7.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"></path></svg></span><span><small>شهر شما</small><b>{{ city }}</b></span></div><dc-import name="MenuList" groups="{{ groups }}" hint-size="100%,420px"></dc-import></div><div class="MenuDrawer_ft"><svg class="MenuDrawer_lg" viewBox="0 0 902.92 251.16" role="img" aria-label="دکون Dokoon"><use href="#dk-logo"></use></svg><small>نسخه {{ version }}</small></div></aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"user": {"editor": null}, "city": {"editor": null}, "groups": {"editor": null}, "version": {"editor": null}, "onClose": {"editor": null}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
const u = P.user || {}; return { initial: u.initial ?? '', name: u.name ?? '', phone: u.phone ?? '', city: P.city ?? '', version: P.version ?? '', groups: P.groups || [], close: (e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); if(P.onClose) P.onClose(); } };
}
}
</script>
</body>
</html>
