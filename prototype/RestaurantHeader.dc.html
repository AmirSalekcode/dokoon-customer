<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>سربرگ رستوران</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.RestaurantHeader_rh{font-family:'Yekan Bakh',Tahoma,sans-serif;color:var(--ink,#1F1A17)}.RestaurantHeader_cv{position:relative;height:232px;overflow:hidden}.RestaurantHeader_cv::before{content:"";position:absolute;left:-10%;top:10%;width:80%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(245,179,47,.5),transparent 66%);animation:bob 5s ease-in-out infinite}.RestaurantHeader_art{position:absolute;left:4%;bottom:56px;width:52%;aspect-ratio:1;filter:drop-shadow(0 14px 14px rgba(0,0,0,.4));animation:float 4.5s ease-in-out infinite}.RestaurantHeader_tb{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;z-index:2}.RestaurantHeader_tb .RestaurantHeader_g{display:flex;gap:8px}.RestaurantHeader_tb button{width:48px;height:48px;border:0;border-radius:50%;background:var(--sf,#fff);box-shadow:0 4px 16px rgba(31,26,23,.12);display:grid;place-items:center;cursor:pointer;color:var(--ink,#1F1A17);padding:0;transition:transform .2s ease-out}.RestaurantHeader_tb button:hover{transform:scale(1.08)}.RestaurantHeader_tb button:focus-visible{outline:3px solid #E4501E;outline-offset:2px}.RestaurantHeader_tb .RestaurantHeader__on svg{fill:#E4501E;stroke:#E4501E}.RestaurantHeader_info{position:relative;margin:-48px 16px 0;background:var(--sf,#fff);border-radius:28px;padding:16px;box-shadow:0 8px 24px rgba(31,26,23,.1)}.RestaurantHeader_nm{display:flex;align-items:center;gap:12px}.RestaurantHeader_lg{width:56px;height:56px;border-radius:20px;background:radial-gradient(circle at 50% 60%,var(--sf,#FFFFFF),var(--soft,#FCE3D0));display:grid;place-items:center;flex:none}.RestaurantHeader_lg svg{width:40px;height:40px;animation:bob 3s ease-in-out infinite}.RestaurantHeader_nm h1{margin:0;font-size:20px;font-weight:700;line-height:1.4}.RestaurantHeader_nm p{margin:0;font-size:12px;color:var(--mu,#7A6E66);line-height:1.6}.RestaurantHeader_nm>div{flex:1;min-width:0}.RestaurantHeader_st{flex:none;font-size:12px;font-weight:700;line-height:1.6;border-radius:999px;padding:0 12px}.RestaurantHeader_st.RestaurantHeader__ok{color:#16A34A;border:1.5px solid #16A34A;background:var(--sf,#fff)}.RestaurantHeader_st.RestaurantHeader__no{color:#fff;background:#C8281E;border:1.5px solid #C8281E}.RestaurantHeader_stats{display:flex;margin-top:16px;padding-top:12px;border-top:1px solid var(--ln,#F0DFD0)}.RestaurantHeader_stats div{flex:1;text-align:center;font-size:12px;color:var(--mu,#7A6E66);line-height:1.6}.RestaurantHeader_stats div+div{border-inline-start:1px solid var(--ln,#F0DFD0)}.RestaurantHeader_stats b{display:block;font-size:16px;font-weight:700;color:var(--ink,#1F1A17);line-height:1.5}.RestaurantHeader_stats .RestaurantHeader_s{color:#F5B32F;display:inline-block;animation:twinkle 2.4s ease-in-out infinite}.RestaurantHeader_rw{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--ln,#F0DFD0);font-size:12px;color:var(--mu,#7A6E66);line-height:1.6}.RestaurantHeader_rw b{color:var(--ink,#1F1A17);font-weight:700}.RestaurantHeader_cl{display:flex;align-items:center;gap:12px;margin:12px 16px 0;padding:12px 16px;border-radius:20px;background:#1F1A17;color:#fff;font-size:14px;line-height:1.7}.RestaurantHeader_cl b{font-weight:700}.RestaurantHeader_of{display:flex;align-items:center;gap:12px;margin:12px 16px 0;padding:12px 16px;border-radius:20px;background:var(--soft,#FCE3D0);color:var(--pr2,#C2410C);font-size:14px;font-weight:700;line-height:1.7}.RestaurantHeader_of svg,.RestaurantHeader_cl svg{animation:wob 3s ease-in-out infinite}.RestaurantHeader_ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<section class="RestaurantHeader_rh" dir="rtl"><div class="RestaurantHeader_cv" style="background: {{ cover }}"><div class="RestaurantHeader_tb"><button aria-label="بازگشت" onClick="{{ back }}"><svg class="RestaurantHeader_ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button><div class="RestaurantHeader_g"><button aria-label="اشتراک‌گذاری" onClick="{{ share }}"><svg class="RestaurantHeader_ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"></path></svg></button><button class="{{ favCls }}" aria-label="علاقه‌مندی" onClick="{{ fav }}"><svg class="RestaurantHeader_ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></button></div></div><svg class="RestaurantHeader_art" viewBox="0 0 100 100" aria-hidden="true"><use href="#{{ art }}"></use></svg></div><div class="RestaurantHeader_info"><div class="RestaurantHeader_nm"><span class="RestaurantHeader_lg"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#{{ art }}"></use></svg></span><div><h1>{{ name }}</h1><p>{{ sub }} · {{ km }} کیلومتر</p></div><span class="RestaurantHeader_st {{ stCls }}">{{ statusText }}</span></div><div class="RestaurantHeader_stats"><div><b><span class="RestaurantHeader_s">★</span> {{ rating }}</b>{{ reviews }} نظر</div><div><b>{{ eta }}</b>دقیقه</div><div><b>{{ feeShort }}</b>هزینه ارسال</div></div><div class="RestaurantHeader_rw"><span>حداقل سفارش: <b>{{ minOrder }}</b></span><span>ساعت کاری: <b>{{ hours }}</b></span></div></div><sc-if value="{{ closed }}" hint-placeholder-val="{{ false }}"><div class="RestaurantHeader_cl"><svg class="RestaurantHeader_ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2"></path></svg><span>این رستوران الان بسته است. <b>بازشدن بعدی: {{ opensNext }}</b></span></div></sc-if><sc-if value="{{ hasOffer }}" hint-placeholder-val="{{ true }}"><div class="RestaurantHeader_of"><svg class="RestaurantHeader_ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8zM7.5 8.5h.01"></path></svg><span>{{ offer }}</span></div></sc-if></section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"r": {"editor": null}, "onBack": {"editor": null}, "onFav": {"editor": null}, "onShare": {"editor": null}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
const r = P.r || {}; return { cover: r.cover ?? '#8B2313', art: r.art ?? '', name: r.name ?? '', sub: r.sub ?? '', km: r.km ?? '', rating: r.rating ?? '', reviews: r.reviews ?? '', eta: r.eta ?? '', feeShort: r.feeShort ?? '', minOrder: r.minOrderText ?? '', hours: r.hours ?? '', closed: r.isOpen === false, opensNext: r.opensNext ?? '', stCls: r.isOpen === false ? 'RestaurantHeader__no' : 'RestaurantHeader__ok', statusText: r.isOpen === false ? 'بسته' : 'باز', favCls: r.fav ? 'RestaurantHeader__on' : '', hasOffer: !!r.offer && r.isOpen !== false, offer: r.offer ?? '', back: (e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); if(P.onBack) P.onBack(); }, fav: (e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); if(P.onFav) P.onFav(); }, share: (e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); if(P.onShare) P.onShare(); } };
}
}
</script>
</body>
</html>
