<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>فیلتر و مرتب‌سازی</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.FilterSheet_sh{position:absolute;left:0;right:0;bottom:0;height:90%;display:flex;flex-direction:column;background:var(--bg,#FBF0E6);border-radius:28px 28px 0 0;box-shadow:0 -12px 32px rgba(0,0,0,.25);animation:slideU .55s cubic-bezier(.2,.8,.2,1) both;font-family:'Yekan Bakh',Tahoma,sans-serif;color:var(--ink,#1F1A17)}.FilterSheet_hd{padding:8px 16px 12px;border-bottom:1px solid var(--ln,#F0DFD0)}.FilterSheet_hl{display:block;width:48px;height:4px;border-radius:99px;background:var(--ln,#F0DFD0);margin:0 auto 12px}.FilterSheet_hr{display:flex;align-items:center;justify-content:space-between}.FilterSheet_hr h2{margin:0;font-size:20px;font-weight:700;line-height:1.4}.FilterSheet_cl{height:48px;padding:0 8px;border:0;background:none;color:var(--pr2,#C2410C);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}.FilterSheet_cl:focus-visible,.FilterSheet_row:focus-visible,.FilterSheet_ap:focus-visible{outline:3px solid #E4501E;outline-offset:2px}.FilterSheet_bd{flex:1;overflow-y:auto;padding:0 16px 16px;scrollbar-width:none}.FilterSheet_bd::-webkit-scrollbar{display:none}.FilterSheet_h{margin:20px 0 12px;font-size:16px;font-weight:700;line-height:1.5}.FilterSheet_wr{display:flex;flex-wrap:wrap;gap:8px}.FilterSheet_box{background:var(--sf,#fff);border-radius:20px;padding:0 16px;box-shadow:0 4px 16px rgba(31,26,23,.06)}.FilterSheet_row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:64px;border:0;background:none;padding:0;cursor:pointer;font-family:inherit;text-align:right;color:var(--ink,#1F1A17)}.FilterSheet_row+.FilterSheet_row{border-top:1px solid var(--ln,#F0DFD0)}.FilterSheet_row b{display:block;font-size:14px;font-weight:700;line-height:1.7}.FilterSheet_row small{display:block;font-size:12px;color:var(--mu,#7A6E66);line-height:1.6}.FilterSheet_sw{width:52px;height:32px;border-radius:99px;background:var(--ln,#F0DFD0);position:relative;flex:none;direction:ltr;transition:background .25s ease-out}.FilterSheet_sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--sf,#fff);box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.2,.8,.2,1)}.FilterSheet_row.FilterSheet__on .FilterSheet_sw{background:#E4501E}.FilterSheet_row.FilterSheet__on .FilterSheet_sw::after{transform:translateX(20px)}.FilterSheet_ft{padding:12px 16px 16px;background:var(--sf,#fff);border-radius:28px 28px 0 0;box-shadow:0 -8px 24px rgba(31,26,23,.12)}.FilterSheet_ap{width:100%;height:56px;display:flex;align-items:center;justify-content:center;border:0;border-radius:999px;background:#E4501E;color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(228,80,30,.25);transition:transform .2s ease-out}.FilterSheet_ap:hover{transform:scale(1.02)}
</style>
</helmet>
<div class="FilterSheet_sh" dir="rtl" role="dialog" aria-label="فیلتر و مرتب‌سازی"><div class="FilterSheet_hd"><i class="FilterSheet_hl"></i><div class="FilterSheet_hr"><h2>فیلتر و مرتب‌سازی</h2><button class="FilterSheet_cl" onClick="{{ clear }}">حذف همه</button></div></div><div class="FilterSheet_bd"><h3 class="FilterSheet_h">مرتب‌سازی</h3><div class="FilterSheet_wr"><sc-for list="{{ sort }}" as="c" hint-placeholder-count="4"><dc-import name="FilterChip" label="{{ c.label }}" selected="{{ c.selected }}" on-pick="{{ c.pick }}" hint-size="120px,48px"></dc-import></sc-for></div><h3 class="FilterSheet_h">فقط نشان بده</h3><div class="FilterSheet_box"><sc-for list="{{ toggles }}" as="t" hint-placeholder-count="3"><button class="FilterSheet_row {{ t.cls }}" role="switch" aria-checked="{{ t.on }}" onClick="{{ t.flip }}"><span><b>{{ t.title }}</b><small>{{ t.sub }}</small></span><span class="FilterSheet_sw"></span></button></sc-for></div><h3 class="FilterSheet_h">نوع غذا</h3><div class="FilterSheet_wr"><sc-for list="{{ tags }}" as="c" hint-placeholder-count="6"><dc-import name="FilterChip" label="{{ c.label }}" art="{{ c.art }}" selected="{{ c.selected }}" on-pick="{{ c.pick }}" hint-size="120px,48px"></dc-import></sc-for></div><h3 class="FilterSheet_h">حداقل امتیاز</h3><div class="FilterSheet_wr"><sc-for list="{{ ratings }}" as="c" hint-placeholder-count="3"><dc-import name="FilterChip" label="{{ c.label }}" selected="{{ c.selected }}" on-pick="{{ c.pick }}" hint-size="120px,48px"></dc-import></sc-for></div></div><div class="FilterSheet_ft"><button class="FilterSheet_ap" onClick="{{ apply }}">{{ countText }}</button></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sort": {"editor": null}, "toggles": {"editor": null}, "tags": {"editor": null}, "ratings": {"editor": null}, "countText": {"editor": null}, "onClear": {"editor": null}, "onApply": {"editor": null}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
return { sort: P.sort || [], toggles: P.toggles || [], tags: P.tags || [], ratings: P.ratings || [], countText: P.countText ?? '', clear: (e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); if(P.onClear) P.onClear(); }, apply: (e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); if(P.onApply) P.onApply(); } };
}
}
</script>
</body>
</html>
