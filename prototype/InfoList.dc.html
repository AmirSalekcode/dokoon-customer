<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>فهرست اطلاعات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.InfoList_il{background:var(--sf,#fff);border-radius:20px;box-shadow:0 4px 16px rgba(31,26,23,.06);padding:4px 16px;font-family:'Yekan Bakh',Tahoma,sans-serif;color:var(--ink,#1F1A17)}
.InfoList_r{display:flex;justify-content:space-between;gap:16px;padding:12px 0;font-size:14px;line-height:1.7}.InfoList_r+.InfoList_r{border-top:1px solid var(--ln,#F0DFD0)}
.InfoList_r span{color:var(--mu,#7A6E66);flex:none}.InfoList_r b{font-weight:700;text-align:left}
</style>
</helmet>
<div class="InfoList_il" dir="rtl"><sc-for list="{{ rows }}" as="r" hint-placeholder-count="4"><div class="InfoList_r"><span>{{ r.label }}</span><b>{{ r.value }}</b></div></sc-for></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"rows": {"editor": null}, "$preview": {"width": 358, "height": 220}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
return { rows: P.rows || [] };
}
}
</script>
</body>
</html>
