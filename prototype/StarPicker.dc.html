<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>انتخاب ستاره</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.StarPicker_w{font-family:'Yekan Bakh',Tahoma,sans-serif;color:var(--ink,#1F1A17)}.StarPicker_st{display:flex;justify-content:center;gap:8px;direction:ltr}
.StarPicker_s{width:48px;height:48px;border:0;background:none;padding:0;cursor:pointer;transition:transform .2s ease-out}.StarPicker_s:hover{transform:scale(1.15)}
.StarPicker_s svg{width:100%;height:100%;fill:var(--ln,#F0DFD0);stroke:var(--ln,#F0DFD0);stroke-width:1;stroke-linejoin:round;transition:fill .2s ease-out,stroke .2s ease-out}
.StarPicker_s.StarPicker__on svg{fill:#F5B32F;stroke:#F5B32F;animation:pop .3s ease-out}.StarPicker_s:focus-visible{outline:3px solid #E4501E;outline-offset:2px}
.StarPicker_lb{text-align:center;font-size:14px;font-weight:700;color:var(--pr2,#C2410C);min-height:24px;line-height:1.7}
</style>
</helmet>
<div class="StarPicker_w" dir="rtl"><div class="StarPicker_st"><sc-for list="{{ items }}" as="s" hint-placeholder-count="5"><button class="StarPicker_s {{ s.cls }}" aria-label="{{ s.label }}" onClick="{{ s.pick }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.7 19.8l1.1-6.1L3.3 9.4l6.1-.8z"></path></svg></button></sc-for></div><div class="StarPicker_lb">{{ label }}</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"items": {"editor": null}, "label": {"editor": null}, "$preview": {"width": 358, "height": 80}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
return { items: P.items || [], label: P.label ?? '' };
}
}
</script>
</body>
</html>
