name: CD

# Publishes artifacts. Deployment to a server is not wired yet (hosting is an open decision):
# the image is pushed to GHCR and can be pulled by any host.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build & push web image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      # Build args are PUBLIC (they end up in the browser bundle) → repository *variables*, never secrets.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_MODE=${{ vars.BUILD_MODE || 'production' }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_NESHAN_MAP_KEY=${{ vars.VITE_NESHAN_MAP_KEY }}
            VITE_BALAD_MAP_KEY=${{ vars.VITE_BALAD_MAP_KEY }}
            VITE_DEFAULT_MAP=${{ vars.VITE_DEFAULT_MAP || 'neshan' }}
            VITE_PAYMENT_PROVIDER=${{ vars.VITE_PAYMENT_PROVIDER || 'fake' }}
            VITE_WEBPUSH_VAPID_PUBLIC_KEY=${{ vars.VITE_WEBPUSH_VAPID_PUBLIC_KEY }}

  android-release:
    name: Signed release APK (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_NESHAN_MAP_KEY: ${{ vars.VITE_NESHAN_MAP_KEY }}
          VITE_BALAD_MAP_KEY: ${{ vars.VITE_BALAD_MAP_KEY }}
          VITE_PAYMENT_PROVIDER: ${{ vars.VITE_PAYMENT_PROVIDER }}
      - run: npm run secrets:scan:dist
      - run: npx cap sync android
      - name: Decode keystore (secret never written to the repo)
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Gradle assembleRelease
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
