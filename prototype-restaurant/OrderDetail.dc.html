<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>جزئیات سفارش</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:300;font-display:swap;src:url(/_blob/2ef92529418867881b213c86e0698e5f) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:400;font-display:swap;src:url(/_blob/bd549ffc7e0220163cf551aa8c12f971) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:500;font-display:swap;src:url(/_blob/2c86d88b0953b236f79c30f4ec52072f) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:700;font-display:swap;src:url(/_blob/17ce6732741785f9a10e038c7f86abc8) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:800;font-display:swap;src:url(/_blob/0208d433250cedfb8a54737f1d0176d9) format('truetype')}
.OD_w{font-family:'Yekan Bakh',Tahoma,sans-serif;display:flex;flex-direction:column;gap:12px;color:var(--ink,#1F1A17)}
.OD_cd{background:var(--sf,#fff);border-radius:28px;padding:16px;box-shadow:0 4px 16px rgba(31,26,23,.06);display:flex;flex-direction:column;gap:12px}
.OD_h{display:flex;align-items:center;gap:8px}.OD_no{font-size:24px;font-weight:800;line-height:1.3}
.OD_bd{height:28px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:800;line-height:28px;color:#fff;background:#E4501E}
.OD_prep{background:#F5B32F;color:#1F1A17}.OD_ready{background:#8B2313}.OD_way{background:#1F1A17}.OD_done{background:var(--ln,#F0DFD0);color:var(--mu,#7A6E66)}.OD_bad{background:#C8281E}
.OD_tm{margin-inline-start:auto;font-size:12px;color:var(--mu,#7A6E66)}
.OD_eta{display:flex;align-items:center;gap:8px;padding:12px;border-radius:20px;background:var(--bg,#FBF0E6);font-size:14px;font-weight:700}
.OD_eta svg{width:20px;height:20px;fill:none;stroke:var(--pr2,#C2410C);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.OD_eta button{font-family:'Yekan Bakh',Tahoma,sans-serif;margin-inline-start:auto;height:40px;padding:0 16px;border:0;border-radius:999px;background:var(--soft,#FCE3D0);color:var(--pr2,#C2410C);font-size:12px;font-weight:800;cursor:pointer}
.OD_t{margin:0;font-size:14px;font-weight:800;color:var(--mu,#7A6E66)}
.OD_li{display:flex;gap:12px;align-items:flex-start;font-size:15px;font-weight:700;line-height:1.6}
.OD_q{flex:none;min-width:32px;height:32px;border-radius:12px;background:var(--soft,#FCE3D0);color:var(--pr2,#C2410C);font-weight:800;display:grid;place-items:center}
.OD_li span:nth-child(2){flex:1}.OD_li small{display:block;font-size:12px;font-weight:400;color:var(--mu,#7A6E66)}.OD_li em{font-style:normal;font-weight:700;font-size:14px}
.OD_nt{background:var(--soft,#FCE3D0);border-radius:12px;padding:12px;font-size:14px;line-height:1.7}.OD_nt b{display:block;font-size:12px;color:var(--pr2,#C2410C)}
.OD_r{display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:1.7}.OD_r span{color:var(--mu,#7A6E66)}.OD_r b{font-weight:700}
.OD_tl{display:flex;justify-content:space-between;border-top:1px solid var(--ln,#F0DFD0);padding-top:12px;font-size:16px;font-weight:800}
.OD_py{display:flex;align-items:center;gap:8px;padding:12px;border-radius:20px;background:var(--bg,#FBF0E6);color:var(--ink,#1F1A17);font-size:14px;font-weight:700;line-height:1.7}.OD_cs{background:var(--soft,#FCE3D0);color:var(--pr2,#C2410C)}
.OD_py svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.OD_cr{display:flex;align-items:center;gap:12px}.OD_cb{width:48px;height:48px;flex:none;border-radius:50%;background:var(--soft,#FCE3D0);color:var(--pr2,#C2410C);display:grid;place-items:center}
.OD_cb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.OD_cr div{flex:1}.OD_cr b{font-size:15px}.OD_cr small{display:block;font-size:12px;color:var(--mu,#7A6E66)}
.OD_cl{font-family:'Yekan Bakh',Tahoma,sans-serif;height:48px;padding:0 16px;border:2px solid #E4501E;border-radius:999px;background:none;color:var(--pr2,#C2410C);font-size:14px;font-weight:800;cursor:pointer}
.OD_ac{display:flex;flex-direction:column;gap:8px}
.OD_p1{font-family:'Yekan Bakh',Tahoma,sans-serif;height:60px;border:0;border-radius:999px;background:#E4501E;color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(228,80,30,.25)}
.OD_ok{background:#8B2313;box-shadow:0 8px 24px rgba(139,35,19,.25)}.OD_dk{background:#1F1A17;box-shadow:none}
.OD_p2{font-family:'Yekan Bakh',Tahoma,sans-serif;height:52px;border:2px solid var(--ln,#F0DFD0);border-radius:999px;background:var(--sf,#fff);color:var(--ink,#1F1A17);font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.OD_p2 svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.OD_dn{color:#C8281E;border-color:#C8281E}
.OD_p1:focus-visible,.OD_p2:focus-visible,.OD_cl:focus-visible,.OD_eta button:focus-visible{outline:3px solid #E4501E;outline-offset:2px}
</style>
</helmet>
<div class="OD_w" dir="rtl"><div class="OD_cd"><div class="OD_h"><b class="OD_no">{{ no }}</b><span class="OD_bd {{ toneCls }}">{{ statusLabel }}</span><span class="OD_tm">{{ placed }}</span></div><sc-if value="{{ hasEta }}" hint-placeholder-val="{{ true }}"><div class="OD_eta"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2"></path></svg><span>{{ etaText }}</span><sc-if value="{{ canAddTime }}" hint-placeholder-val="{{ true }}"><button onClick="{{ addTime }}">افزودن زمان</button></sc-if></div></sc-if></div><div class="OD_cd"><h4 class="OD_t">اقلام سفارش</h4><sc-for list="{{ items }}" as="x" hint-placeholder-count="3"><div class="OD_li"><span class="OD_q">{{ x.q }}</span><span>{{ x.name }}<small>{{ x.opt }}</small></span><em>{{ x.price }}</em></div></sc-for><sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}"><div class="OD_nt"><b>توضیح مشتری</b>{{ note }}</div></sc-if><sc-for list="{{ rows }}" as="r" hint-placeholder-count="1"><div class="OD_r"><span>{{ r.label }}</span><b>{{ r.value }}</b></div></sc-for><div class="OD_tl"><span>مبلغ غذاها</span><span>{{ total }}</span></div><div class="OD_py {{ payCls }}"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h15a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h12M16 14h2"></path></svg><span>{{ payText }}</span></div></div><div class="OD_cd"><h4 class="OD_t">مشتری و تحویل</h4><div class="OD_cr"><span class="OD_cb"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 21a8 8 0 0 1 16 0"></path></svg></span><div><b>{{ customer }}</b><small>{{ area }}</small></div></div><sc-if value="{{ hasCourier }}" hint-placeholder-val="{{ true }}"><div class="OD_cr"><span class="OD_cb"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7M7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path></svg></span><div><b>{{ courierName }}</b><small>{{ courierSub }}</small></div><sc-if value="{{ canCall }}" hint-placeholder-val="{{ true }}"><button class="OD_cl" onClick="{{ call }}">تماس</button></sc-if></div></sc-if></div><div class="OD_ac"><sc-if value="{{ hasPrimary }}" hint-placeholder-val="{{ true }}"><button class="OD_p1 {{ primCls }}" onClick="{{ primary }}">{{ primaryLabel }}</button></sc-if><button class="OD_p2" onClick="{{ print }}"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V4h10v5M7 18H5a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2M7 14h10v6H7z"></path></svg>چاپ رسید</button><sc-if value="{{ hasSecondary }}" hint-placeholder-val="{{ false }}"><button class="OD_p2 OD_dn" onClick="{{ secondary }}">{{ secondaryLabel }}</button></sc-if></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"order": {"editor": null}, "onPrimary": {"editor": null}, "onSecondary": {"editor": null}, "onAddTime": {"editor": null}, "onPrint": {"editor": null}, "onCall": {"editor": null}, "$preview": {"width": 358, "height": 900}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
const o = P.order || {};
const pr = o.primary || {};
const co = o.courier || null;
return { no: o.no ?? '', statusLabel: o.statusLabel ?? '', toneCls: 'OD_' + (o.tone || 'new'), placed: o.placed ?? '', hasEta: !!o.etaText, etaText: o.etaText ?? '', canAddTime: !!o.canAddTime, items: o.items || [], hasNote: !!o.note, note: o.note ?? '', rows: o.rows || [], total: o.total ?? '', payText: o.payText ?? '', payCls: o.pay === 'cash' ? 'OD_cs' : '', customer: o.customer ?? '', area: o.area ?? '', hasCourier: !!co, courierName: co ? co.name : '', courierSub: co ? co.sub : '', canCall: !!(co && co.canCall), hasPrimary: !!pr.label, primaryLabel: pr.label ?? '', primCls: pr.tone === 'ok' ? 'OD_ok' : (pr.tone === 'dark' ? 'OD_dk' : ''), hasSecondary: !!o.secondaryLabel, secondaryLabel: o.secondaryLabel ?? '', primary: () => { if (P.onPrimary) P.onPrimary(); }, secondary: () => { if (P.onSecondary) P.onSecondary(); }, addTime: () => { if (P.onAddTime) P.onAddTime(); }, print: () => { if (P.onPrint) P.onPrint(); }, call: () => { if (P.onCall) P.onCall(); } };
}
}
</script>
</body>
</html>
