<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>نوار مراحل ثبت‌نام</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:300;font-display:swap;src:url(/_blob/2ef92529418867881b213c86e0698e5f) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:400;font-display:swap;src:url(/_blob/bd549ffc7e0220163cf551aa8c12f971) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:500;font-display:swap;src:url(/_blob/2c86d88b0953b236f79c30f4ec52072f) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:700;font-display:swap;src:url(/_blob/17ce6732741785f9a10e038c7f86abc8) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:800;font-display:swap;src:url(/_blob/0208d433250cedfb8a54737f1d0176d9) format('truetype')}
.WB_w{font-family:'Yekan Bakh',Tahoma,sans-serif;display:flex;align-items:flex-start;color:var(--ink,#1F1A17)}
.WB_s{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.WB_s::before{content:"";position:absolute;top:15px;inset-inline-start:50%;width:100%;height:3px;background:var(--ln,#F0DFD0)}
.WB_s:last-child::before{display:none}.WB_done::before{background:#E4501E}
.WB_d{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;background:var(--sf,#fff);border:3px solid var(--ln,#F0DFD0);display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--mu,#7A6E66)}
.WB_done .WB_d{background:#E4501E;border-color:#E4501E;color:#fff}.WB_cur .WB_d{border-color:#E4501E;color:var(--pr2,#C2410C)}
.WB_d svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.WB_l{font-size:12px;font-weight:700;color:var(--mu,#7A6E66);text-align:center;line-height:1.5}.WB_cur .WB_l{color:var(--ink,#1F1A17)}
</style>
</helmet>
<ol class="WB_w" dir="rtl" aria-label="مراحل ثبت‌نام" style="list-style:none;margin:0;padding:0"><sc-for list="{{ steps }}" as="s" hint-placeholder-count="4"><li class="WB_s {{ s.cls }}"><span class="WB_d"><sc-if value="{{ s.done }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if><sc-if value="{{ s.todo }}" hint-placeholder-val="{{ true }}">{{ s.n }}</sc-if></span><span class="WB_l">{{ s.label }}</span></li></sc-for></ol>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"steps": {"editor": null}, "$preview": {"width": 358, "height": 80}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
const steps = (P.steps || []).map((s, i) => ({ label: s.label, n: s.n ?? String(i + 1), done: s.state === 'done', todo: s.state !== 'done', cls: s.state === 'done' ? 'WB_done' : (s.state === 'cur' ? 'WB_cur' : '') }));
return { steps: steps };
}
}
</script>
</body>
</html>
