.QuantityStepper_qs{display:inline-flex;align-items:center;gap:4px;background:var(--sf,#fff);border-radius:999px;padding:4px;box-shadow:0 4px 16px rgba(31,26,23,.06);font-family:'Yekan Bakh',Tahoma,sans-serif;}.QuantityStepper_qb{width:40px;height:40px;border-radius:50%;background:var(--soft,#FCE3D0);color:var(--pr2,#C2410C);display:grid;place-items:center;border:0;padding:0;cursor:pointer;transition:transform .15s ease-out}.QuantityStepper_qb:active{transform:scale(.88)}.QuantityStepper_qb:focus-visible{outline:3px solid #E4501E;outline-offset:2px}.QuantityStepper_qv{min-width:32px;text-align:center;font-size:16px;font-weight:700;color:var(--ink,#1F1A17)}.QuantityStepper_ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

<script type="text/x-dc" data-dc-script data-props='{"value": {"editor": null}, "onInc": {"editor": null}, "onDec": {"editor": null}}'>

renderVals() {
const P = this.props;
return { value: P.value ?? '۱', inc: (e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); if(P.onInc) P.onInc(); }, dec: (e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); if(P.onDec) P.onDec(); } };
}
}
</script>
