.CD_d{font-family:'Yekan Bakh',Tahoma,sans-serif;background:var(--sf,#fff);color:var(--ink,#1F1A17);border-radius:28px;padding:24px 16px 16px;box-shadow:0 12px 32px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px;text-align:center}
.CD_d h3{margin:0;font-size:20px;font-weight:800;line-height:1.5}.CD_d p{margin:0;font-size:14px;line-height:1.8;color:var(--mu,#7A6E66)}

.CD_ok{font-family:'Yekan Bakh',Tahoma,sans-serif;height:56px;border:0;border-radius:999px;background:#E4501E;color:#fff;font-size:15px;font-weight:800;cursor:pointer}.CD_dn{background:#C8281E}.CD_gr{background:#E4501E}

<div class="CD_d" dir="rtl" role="alertdialog" aria-label="{{ title }}"><h3>{{ title }}</h3><p>{{ text }}</p><div class="CD_a"><button class="CD_ok {{ cls }}" onClick="{{ confirm }}">{{ confirmLabel }}</button><button class="CD_no" onClick="{{ cancel }}">{{ cancelLabel }}</button></div></div>

<script type="text/x-dc" data-dc-script data-props='{"title": {"editor": null}, "text": {"editor": null}, "confirmLabel": {"editor": null}, "cancelLabel": {"editor": null}, "tone": {"editor": null}, "onConfirm": {"editor": null}, "onCancel": {"editor": null}, "$preview": {"width": 358, "height": 240}}'>
class Component extends DCLogic {

const P = this.props;
return { title: P.title ?? '', text: P.text ?? '', confirmLabel: P.confirmLabel ?? 'تأیید', cancelLabel: P.cancelLabel ?? 'انصراف', cls: P.tone === 'danger' ? 'CD_dn' : (P.tone === 'ok' ? 'CD_gr' : ''), confirm: () => { if (P.onConfirm) P.onConfirm(); }, cancel: () => { if (P.onCancel) P.onCancel(); } };
