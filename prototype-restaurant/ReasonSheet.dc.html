<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>برگه‌ی انتخاب دلیل</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:300;font-display:swap;src:url(/_blob/2ef92529418867881b213c86e0698e5f) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:400;font-display:swap;src:url(/_blob/bd549ffc7e0220163cf551aa8c12f971) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:500;font-display:swap;src:url(/_blob/2c86d88b0953b236f79c30f4ec52072f) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:700;font-display:swap;src:url(/_blob/17ce6732741785f9a10e038c7f86abc8) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:800;font-display:swap;src:url(/_blob/0208d433250cedfb8a54737f1d0176d9) format('truetype')}
.RS_s{font-family:'Yekan Bakh',Tahoma,sans-serif;background:var(--sf,#fff);color:var(--ink,#1F1A17);border-radius:28px 28px 0 0;padding:12px 16px 16px;box-shadow:0 -12px 32px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px}
.RS_gr{width:48px;height:4px;border-radius:999px;background:var(--ln,#F0DFD0);align-self:center}
.RS_hd{display:flex;align-items:center;gap:12px}.RS_hd h3{margin:0;flex:1;font-size:20px;font-weight:800;line-height:1.4}
.RS_x{width:48px;height:48px;border:0;border-radius:50%;background:var(--bg,#FBF0E6);color:var(--ink,#1F1A17);display:grid;place-items:center;cursor:pointer;padding:0}
.RS_x svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.RS_p{margin:0;font-size:14px;line-height:1.7;color:var(--mu,#7A6E66)}
.RS_l{display:flex;flex-direction:column;gap:8px}
.RS_r{font-family:'Yekan Bakh',Tahoma,sans-serif;display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border:2px solid var(--ln,#F0DFD0);border-radius:20px;background:var(--sf,#fff);color:inherit;font-size:15px;font-weight:700;text-align:right;cursor:pointer}
.RS_r:focus-visible{outline:3px solid #E4501E;outline-offset:2px}
.RS_m{width:24px;height:24px;border-radius:50%;border:2px solid var(--ln,#F0DFD0);flex:none;display:grid;place-items:center}
.RS_on{border-color:#C8281E;background:var(--soft,#FCE3D0)}.RS_on .RS_m{border-color:#C8281E}.RS_on .RS_m::after{content:"";width:12px;height:12px;border-radius:50%;background:#C8281E}
.RS_ok{font-family:'Yekan Bakh',Tahoma,sans-serif;height:56px;border:0;border-radius:999px;background:#C8281E;color:#fff;font-size:15px;font-weight:800;cursor:pointer}
.RS_ok:disabled{background:var(--ln,#F0DFD0);color:var(--mu,#7A6E66);cursor:not-allowed}.RS_ok:focus-visible{outline:3px solid #1F1A17;outline-offset:2px}
</style>
</helmet>
<section class="RS_s" dir="rtl"><div class="RS_gr"></div><div class="RS_hd"><h3>{{ title }}</h3><button class="RS_x" aria-label="بستن" onClick="{{ close }}"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div><p class="RS_p">{{ text }}</p><div class="RS_l" role="radiogroup"><sc-for list="{{ items }}" as="x" hint-placeholder-count="3"><button class="RS_r {{ x.cls }}" role="radio" aria-checked="{{ x.on }}" onClick="{{ x.pick }}"><span class="RS_m"></span>{{ x.label }}</button></sc-for></div><button class="RS_ok" disabled="{{ off }}" onClick="{{ confirm }}">{{ confirmLabel }}</button></section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title": {"editor": null}, "text": {"editor": null}, "items": {"editor": null}, "confirmLabel": {"editor": null}, "canConfirm": {"editor": null}, "onPick": {"editor": null}, "onConfirm": {"editor": null}, "onClose": {"editor": null}, "$preview": {"width": 390, "height": 500}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
const items = (P.items || []).map((x) => ({ label: x.label, on: !!x.on, cls: x.on ? 'RS_on' : '', pick: () => { if (P.onPick) P.onPick(x.id); } }));
return { title: P.title ?? '', text: P.text ?? '', items: items, confirmLabel: P.confirmLabel ?? 'تأیید', off: !P.canConfirm, confirm: () => { if (P.onConfirm) P.onConfirm(); }, close: () => { if (P.onClose) P.onClose(); } };
}
}
</script>
</body>
</html>
