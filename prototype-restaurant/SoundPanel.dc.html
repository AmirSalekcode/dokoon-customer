<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>آزمایش صدای هشدار</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:300;font-display:swap;src:url(/_blob/2ef92529418867881b213c86e0698e5f) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:400;font-display:swap;src:url(/_blob/bd549ffc7e0220163cf551aa8c12f971) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:500;font-display:swap;src:url(/_blob/2c86d88b0953b236f79c30f4ec52072f) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:700;font-display:swap;src:url(/_blob/17ce6732741785f9a10e038c7f86abc8) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:800;font-display:swap;src:url(/_blob/0208d433250cedfb8a54737f1d0176d9) format('truetype')}
.SP_c{font-family:'Yekan Bakh',Tahoma,sans-serif;background:var(--sf,#fff);color:var(--ink,#1F1A17);border-radius:28px;padding:16px;box-shadow:0 4px 16px rgba(31,26,23,.06);display:flex;flex-direction:column;gap:16px;align-items:center}
.SP_eq{height:72px;display:flex;align-items:flex-end;gap:6px}
.SP_eq i{width:8px;border-radius:999px;background:#E4501E;height:18px}
.SP_p .SP_eq i{animation:SP_b .9s ease-in-out infinite}.SP_p .SP_eq i:nth-child(2){animation-delay:.1s}.SP_p .SP_eq i:nth-child(3){animation-delay:.2s}.SP_p .SP_eq i:nth-child(4){animation-delay:.3s}.SP_p .SP_eq i:nth-child(5){animation-delay:.15s}.SP_p .SP_eq i:nth-child(6){animation-delay:.25s}.SP_p .SP_eq i:nth-child(7){animation-delay:.05s}
@keyframes SP_b{0%,100%{height:14px}50%{height:68px}}
.SP_pl{font-family:'Yekan Bakh',Tahoma,sans-serif;height:56px;padding:0 32px;border:0;border-radius:999px;background:#E4501E;color:#fff;font-size:15px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(228,80,30,.25)}
.SP_pl svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.SP_pl:focus-visible{outline:3px solid #1F1A17;outline-offset:2px}
.SP_v{width:100%;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700}
.SP_sg{flex:1;display:flex;gap:6px}
.SP_sg button{flex:1;height:40px;border:0;border-radius:8px;background:var(--ln,#F0DFD0);cursor:pointer;padding:0;transition:background .2s ease-out}.SP_sg button.SP_f{background:#E4501E}.SP_sg button:focus-visible{outline:3px solid #1F1A17;outline-offset:2px}
.SP_tn{font-size:12px;color:var(--mu,#7A6E66);text-align:center;line-height:1.7}
</style>
</helmet>
<div class="SP_c {{ cls }}" dir="rtl"><div class="SP_eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><button class="SP_pl" onClick="{{ play }}"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l5 4V6l-5 4zM17 9a4 4 0 0 1 0 6"></path></svg>{{ playLabel }}</button><div class="SP_v"><span>بلندی صدا</span><div class="SP_sg" role="group" aria-label="بلندی صدا"><sc-for list="{{ segs }}" as="s" hint-placeholder-count="5"><button class="{{ s.cls }}" aria-label="{{ s.label }}" onClick="{{ s.pick }}"></button></sc-for></div></div><div class="SP_tn">{{ tone }}</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"playing": {"editor": null}, "level": {"editor": null}, "tone": {"editor": null}, "onPlay": {"editor": null}, "onLevel": {"editor": null}, "$preview": {"width": 358, "height": 300}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
const lv = P.level || 3;
const segs = [1, 2, 3, 4, 5].map((n) => ({ cls: n <= lv ? 'SP_f' : '', label: 'سطح ' + n, pick: () => { if (P.onLevel) P.onLevel(n); } }));
return { cls: P.playing ? 'SP_p' : '', playLabel: P.playing ? 'توقف صدا' : 'پخش صدای سفارش جدید', segs: segs, tone: P.tone ?? '', play: () => { if (P.onPlay) P.onPlay(); } };
}
}
</script>
</body>
</html>
