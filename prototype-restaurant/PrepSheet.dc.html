<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>برگه‌ی زمان آماده‌سازی</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:300;font-display:swap;src:url(/_blob/2ef92529418867881b213c86e0698e5f) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:400;font-display:swap;src:url(/_blob/bd549ffc7e0220163cf551aa8c12f971) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:500;font-display:swap;src:url(/_blob/2c86d88b0953b236f79c30f4ec52072f) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:700;font-display:swap;src:url(/_blob/17ce6732741785f9a10e038c7f86abc8) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:800;font-display:swap;src:url(/_blob/0208d433250cedfb8a54737f1d0176d9) format('truetype')}
.PS_s{font-family:'Yekan Bakh',Tahoma,sans-serif;background:var(--sf,#fff);color:var(--ink,#1F1A17);border-radius:28px 28px 0 0;padding:12px 16px 16px;box-shadow:0 -12px 32px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:16px}
.PS_gr{width:48px;height:4px;border-radius:999px;background:var(--ln,#F0DFD0);align-self:center}
.PS_hd{display:flex;align-items:center;gap:12px}.PS_hd h3{margin:0;flex:1;font-size:20px;font-weight:800;line-height:1.4}
.PS_x{width:48px;height:48px;border:0;border-radius:50%;background:var(--bg,#FBF0E6);color:var(--ink,#1F1A17);display:grid;place-items:center;cursor:pointer;padding:0}
.PS_x svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.PS_p{margin:0;font-size:14px;line-height:1.7;color:var(--mu,#7A6E66)}
.PS_g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.PS_o{font-family:'Yekan Bakh',Tahoma,sans-serif;height:80px;border:2px solid var(--ln,#F0DFD0);border-radius:20px;background:var(--sf,#fff);color:var(--ink,#1F1A17);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:transform .2s ease-out,background .2s ease-out}
.PS_o b{font-size:24px;font-weight:800;line-height:1.3}.PS_o span{font-size:12px;color:var(--mu,#7A6E66)}
.PS_o:hover{transform:scale(1.02)}.PS_o:focus-visible{outline:3px solid #E4501E;outline-offset:2px}
.PS_on{border-color:#E4501E;background:var(--soft,#FCE3D0)}.PS_on b{color:var(--pr2,#C2410C)}
.PS_c{display:flex;align-items:center;justify-content:center;gap:16px}
.PS_c button{width:56px;height:56px;border:0;border-radius:50%;background:var(--soft,#FCE3D0);color:var(--pr2,#C2410C);cursor:pointer;display:grid;place-items:center;padding:0}
.PS_c button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.PS_c output{min-width:96px;text-align:center;font-size:24px;font-weight:800}
.PS_pv{background:var(--bg,#FBF0E6);border-radius:20px;padding:12px 16px}.PS_pv small{display:block;font-size:12px;color:var(--mu,#7A6E66)}.PS_pv b{font-size:16px;font-weight:800;line-height:1.7}
.PS_ok{font-family:'Yekan Bakh',Tahoma,sans-serif;height:56px;border:0;border-radius:999px;background:#E4501E;color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(228,80,30,.25)}
.PS_ok:disabled{background:var(--ln,#F0DFD0);color:var(--mu,#7A6E66);box-shadow:none;cursor:not-allowed}
.PS_ok:focus-visible{outline:3px solid #1F1A17;outline-offset:2px}
</style>
</helmet>
<section class="PS_s" dir="rtl" aria-label="زمان آماده‌سازی"><div class="PS_gr"></div><div class="PS_hd"><h3>زمان آماده‌سازی سفارش</h3><button class="PS_x" aria-label="بستن" onClick="{{ close }}"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div><p class="PS_p">این زمان به مشتری نمایش داده می‌شود. هر زمان که لازم شد می‌توانید زمان را افزایش دهید.</p><div class="PS_g"><sc-for list="{{ opts }}" as="o" hint-placeholder-count="4"><button class="PS_o {{ o.cls }}" aria-pressed="{{ o.on }}" onClick="{{ o.pick }}"><b>{{ o.big }}</b><span>{{ o.small }}</span></button></sc-for></div><sc-if value="{{ custom }}" hint-placeholder-val="{{ false }}"><div class="PS_c"><button aria-label="افزودن پنج دقیقه" onClick="{{ inc }}"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button><output>{{ customVal }}</output><button aria-label="کم کردن پنج دقیقه" onClick="{{ dec }}"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button></div></sc-if><div class="PS_pv"><small>به مشتری اعلام می‌شود</small><b>{{ preview }}</b></div><button class="PS_ok" disabled="{{ off }}" onClick="{{ confirm }}">تأیید و پذیرش سفارش</button></section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"opts": {"editor": null}, "custom": {"editor": null}, "customVal": {"editor": null}, "preview": {"editor": null}, "canConfirm": {"editor": null}, "onPick": {"editor": null}, "onStep": {"editor": null}, "onConfirm": {"editor": null}, "onClose": {"editor": null}, "$preview": {"width": 390, "height": 560}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
const opts = (P.opts || []).map((x) => ({ big: x.big, small: x.small, on: !!x.on, cls: x.on ? 'PS_on' : '', pick: () => { if (P.onPick) P.onPick(x.key); } }));
return { opts: opts, custom: !!P.custom, customVal: P.customVal ?? '', preview: P.preview ?? '', off: !P.canConfirm, inc: () => { if (P.onStep) P.onStep(5); }, dec: () => { if (P.onStep) P.onStep(-5); }, confirm: () => { if (P.onConfirm) P.onConfirm(); }, close: () => { if (P.onClose) P.onClose(); } };
}
}
</script>
</body>
</html>
