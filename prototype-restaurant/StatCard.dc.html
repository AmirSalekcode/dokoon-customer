<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>کارت آمار</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:300;font-display:swap;src:url(/_blob/2ef92529418867881b213c86e0698e5f) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:400;font-display:swap;src:url(/_blob/bd549ffc7e0220163cf551aa8c12f971) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:500;font-display:swap;src:url(/_blob/2c86d88b0953b236f79c30f4ec52072f) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:700;font-display:swap;src:url(/_blob/17ce6732741785f9a10e038c7f86abc8) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:800;font-display:swap;src:url(/_blob/0208d433250cedfb8a54737f1d0176d9) format('truetype')}
.SC_c{font-family:'Yekan Bakh',Tahoma,sans-serif;background:var(--sf,#fff);color:var(--ink,#1F1A17);border-radius:20px;padding:16px;box-shadow:0 4px 16px rgba(31,26,23,.06);display:flex;flex-direction:column;gap:4px;min-width:0}
.SC_h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--mu,#7A6E66)}
.SC_i{width:32px;height:32px;border-radius:12px;background:var(--soft,#FCE3D0);color:var(--pr2,#C2410C);display:grid;place-items:center;flex:none}
.SC_i svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.SC_v{font-size:20px;font-weight:800;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.SC_s{font-size:12px;font-weight:700;color:var(--mu,#7A6E66)}.SC_up{color:var(--pr2,#C2410C)}.SC_dn{color:#C8281E}
</style>
</helmet>
<div class="SC_c" dir="rtl"><div class="SC_h"><span class="SC_i"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="{{ d }}"></path></svg></span>{{ label }}</div><div class="SC_v">{{ value }}</div><div class="SC_s {{ toneCls }}">{{ sub }}</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label": {"editor": null}, "value": {"editor": null}, "sub": {"editor": null}, "d": {"editor": null}, "tone": {"editor": null}, "$preview": {"width": 172, "height": 116}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
return { label: P.label ?? '', value: P.value ?? '', sub: P.sub ?? '', d: P.d ?? '', toneCls: P.tone === 'up' ? 'SC_up' : (P.tone === 'down' ? 'SC_dn' : '') };
}
}
</script>
</body>
</html>
