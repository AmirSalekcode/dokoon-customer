<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>کارت سفارش رستوران</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:300;font-display:swap;src:url(/_blob/2ef92529418867881b213c86e0698e5f) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:400;font-display:swap;src:url(/_blob/bd549ffc7e0220163cf551aa8c12f971) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:500;font-display:swap;src:url(/_blob/2c86d88b0953b236f79c30f4ec52072f) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:700;font-display:swap;src:url(/_blob/17ce6732741785f9a10e038c7f86abc8) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:800;font-display:swap;src:url(/_blob/0208d433250cedfb8a54737f1d0176d9) format('truetype')}
.OrderTile_c{font-family:'Yekan Bakh',Tahoma,sans-serif;background:var(--sf,#fff);color:var(--ink,#1F1A17);border-radius:20px;box-shadow:0 4px 16px rgba(31,26,23,.06);overflow:hidden;display:flex;flex-direction:column}
.OrderTile_new{animation:OrderTile_gl 2.4s ease-in-out infinite}
.OrderTile_sel{box-shadow:0 0 0 3px #E4501E,0 4px 16px rgba(31,26,23,.06)}
@keyframes OrderTile_gl{0%,100%{box-shadow:0 4px 16px rgba(31,26,23,.06),0 0 0 0 rgba(228,80,30,.4)}50%{box-shadow:0 4px 16px rgba(31,26,23,.06),0 0 0 8px rgba(228,80,30,0)}}
.OrderTile_op{font-family:'Yekan Bakh',Tahoma,sans-serif;display:flex;flex-direction:column;gap:12px;padding:16px;border:0;background:none;text-align:right;cursor:pointer;color:inherit;width:100%}
.OrderTile_op:focus-visible{outline:3px solid #E4501E;outline-offset:-3px;border-radius:20px}
.OrderTile_h{display:flex;align-items:center;gap:8px}
.OrderTile_no{font-size:20px;font-weight:800;line-height:1.4}
.OrderTile_bd{height:28px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:800;line-height:28px;color:#fff;background:#E4501E;white-space:nowrap}
.OrderTile_prep{background:#F5B32F;color:#1F1A17}.OrderTile_ready{background:#8B2313}.OrderTile_way{background:#1F1A17}.OrderTile_done{background:var(--ln,#F0DFD0);color:var(--mu,#7A6E66)}.OrderTile_bad{background:#C8281E}
.OrderTile_tm{margin-inline-start:auto;font-size:12px;color:var(--mu,#7A6E66)}
.OrderTile_nm{font-size:16px;font-weight:700;line-height:1.5}
.OrderTile_it{font-size:14px;line-height:1.7;color:var(--mu,#7A6E66);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.OrderTile_m{display:flex;align-items:center;gap:8px}
.OrderTile_py{height:28px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:700;line-height:28px;background:var(--bg,#FBF0E6);color:var(--ink,#1F1A17)}
.OrderTile_cash{background:var(--soft,#FCE3D0);color:var(--pr2,#C2410C)}
.OrderTile_tt{margin-inline-start:auto;font-size:16px;font-weight:800}
.OrderTile_ex{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--pr2,#C2410C)}
.OrderTile_ex svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.OrderTile_ac{font-family:'Yekan Bakh',Tahoma,sans-serif;margin:0 16px 16px;height:56px;border:0;border-radius:999px;background:#E4501E;color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(228,80,30,.25);transition:transform .2s ease-out}
.OrderTile_ac:hover{transform:scale(1.02)}.OrderTile_ac:focus-visible{outline:3px solid #1F1A17;outline-offset:2px}
.OrderTile_ok{background:#8B2313;box-shadow:0 8px 24px rgba(139,35,19,.25)}.OrderTile_dark{background:#1F1A17;box-shadow:none}
</style>
</helmet>
<article class="OrderTile_c {{ cls }}" dir="rtl"><button class="OrderTile_op" onClick="{{ open }}" aria-label="جزئیات سفارش {{ no }}"><div class="OrderTile_h"><b class="OrderTile_no">{{ no }}</b><span class="OrderTile_bd {{ toneCls }}">{{ statusLabel }}</span><span class="OrderTile_tm">{{ timeText }}</span></div><div><div class="OrderTile_nm">{{ name }}</div><div class="OrderTile_it">{{ itemsText }}</div></div><div class="OrderTile_m"><span class="OrderTile_py {{ payCls }}">{{ payLabel }}</span><span class="OrderTile_tt">{{ total }}</span></div><sc-if value="{{ hasExtra }}" hint-placeholder-val="{{ false }}"><div class="OrderTile_ex"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2"></path></svg><span>{{ extraText }}</span></div></sc-if></button><sc-if value="{{ hasAction }}" hint-placeholder-val="{{ true }}"><button class="OrderTile_ac {{ acCls }}" onClick="{{ act }}">{{ actionLabel }}</button></sc-if></article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"order": {"editor": null}, "actionLabel": {"editor": null}, "actionTone": {"editor": null}, "selected": {"editor": null}, "onOpen": {"editor": null}, "onAction": {"editor": null}, "$preview": {"width": 358, "height": 250}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
const o = P.order || {};
const tone = o.tone || 'new';
return { no: o.no ?? '', name: o.name ?? '', itemsText: o.itemsText ?? '', total: o.total ?? '', statusLabel: o.statusLabel ?? '', timeText: o.timeText ?? '', payLabel: o.payLabel ?? '', payCls: o.pay === 'cash' ? 'OrderTile_cash' : '', extraText: o.extraText ?? '', hasExtra: !!o.extraText, toneCls: 'OrderTile_' + tone, cls: (tone === 'new' ? 'OrderTile_new ' : '') + (P.selected ? 'OrderTile_sel' : ''), hasAction: !!P.actionLabel, actionLabel: P.actionLabel ?? '', acCls: P.actionTone === 'ok' ? 'OrderTile_ok' : (P.actionTone === 'dark' ? 'OrderTile_dark' : ''), open: () => { if (P.onOpen) P.onOpen(); }, act: () => { if (P.onAction) P.onAction(); } };
}
}
</script>
</body>
</html>
