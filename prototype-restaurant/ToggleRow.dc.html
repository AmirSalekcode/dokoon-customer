<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>ردیف کلید</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:300;font-display:swap;src:url(/_blob/2ef92529418867881b213c86e0698e5f) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:400;font-display:swap;src:url(/_blob/bd549ffc7e0220163cf551aa8c12f971) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:500;font-display:swap;src:url(/_blob/2c86d88b0953b236f79c30f4ec52072f) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:700;font-display:swap;src:url(/_blob/17ce6732741785f9a10e038c7f86abc8) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:800;font-display:swap;src:url(/_blob/0208d433250cedfb8a54737f1d0176d9) format('truetype')}
.ToggleRow_r{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--sf,#fff);border-radius:20px;box-shadow:0 4px 16px rgba(31,26,23,.06);font-family:'Yekan Bakh',Tahoma,sans-serif;color:var(--ink,#1F1A17)}
.ToggleRow_tx{flex:1;min-width:0}.ToggleRow_t{font-size:14px;font-weight:700;line-height:1.6}.ToggleRow_s{font-size:12px;color:var(--mu,#7A6E66);line-height:1.7}
.ToggleRow_sw{position:relative;width:52px;height:32px;flex:none;border:0;border-radius:999px;background:var(--ln,#F0DFD0);cursor:pointer;padding:0;transition:background .25s ease-out}
.ToggleRow_sw::after{content:"";position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(31,26,23,.2);transition:transform .25s ease-out}
.ToggleRow__on{background:#E4501E}.ToggleRow__on::after{transform:translateX(-20px)}.ToggleRow_sw:focus-visible{outline:3px solid #E4501E;outline-offset:2px}
</style>
</helmet>
<div class="ToggleRow_r" dir="rtl"><span class="ToggleRow_tx"><div class="ToggleRow_t">{{ title }}</div><div class="ToggleRow_s">{{ sub }}</div></span><button class="ToggleRow_sw {{ cls }}" role="switch" aria-checked="{{ on }}" aria-label="{{ title }}" onClick="{{ flip }}"></button></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title": {"editor": null}, "sub": {"editor": null}, "on": {"editor": null}, "onFlip": {"editor": null}, "$preview": {"width": 358, "height": 72}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
return { title: P.title ?? '', sub: P.sub ?? '', on: !!P.on, cls: P.on ? 'ToggleRow__on' : '', flip: (e) => { if (P.onFlip) P.onFlip(); } };
}
}
</script>
</body>
</html>
