openapi: 3.0.3
info: { title: Dokoon Courier API, version: 0.1.0, description: "پیش‌نویس قرارداد اپ پیک (بک‌اند را دوست شما از روی این می‌سازد). مبالغ به تومان و عدد صحیح." }
servers: [{ url: /api }]
security: [{ bearer: [] }]
paths:
  /c/auth/otp: { post: { security: [], summary: ارسال کد, requestBody: { content: { application/json: { schema: { type: object, required: [phone], properties: { phone: { type: string, pattern: '^09\d{9}$' } } } } } }, responses: { '204': { description: ارسال شد }, '429': { description: درخواست زیاد } } } }
  /c/auth/verify: { post: { security: [], summary: تأیید کد, requestBody: { content: { application/json: { schema: { type: object, required: [phone, code], properties: { phone: { type: string }, code: { type: string, minLength: 4, maxLength: 6 } } } } } }, responses: { '200': { description: توکن و وضعیت, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }, '401': { description: کد نادرست } } } }
  /c/me: { get: { summary: پروفایل و وضعیت تأیید, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } } } } }
  /c/doc-types: { get: { summary: فهرست مدارک لازم (data-driven), responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DocType' } } } } } } } }
  /c/registration: { post: { summary: ثبت‌نام, requestBody: { content: { application/json: { schema: { type: object, required: [name, nationalId, plate, sheba], properties: { name: { type: string }, nationalId: { type: string, pattern: '^\d{10}$' }, plate: { type: string }, sheba: { type: string, pattern: '^IR\d{24}$' } } } } } }, responses: { '201': { description: ثبت شد }, '422': { description: خطای اعتبارسنجی } } } }
  /c/documents/{type}: { post: { summary: آپلود/تمدید مدرک, parameters: [{ name: type, in: path, required: true, schema: { type: string } }], requestBody: { content: { multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } } } } } }, responses: { '202': { description: در انتظار بررسی } } } }
  /c/status: { put: { summary: آنلاین/آفلاین, requestBody: { content: { application/json: { schema: { type: object, required: [online], properties: { online: { type: boolean } } } } } }, responses: { '200': { description: OK }, '409': { description: سفارش فعال دارید } } } }
  /c/location: { post: { summary: ارسال موقعیت (فقط آنلاین/سفارش فعال), requestBody: { content: { application/json: { schema: { type: object, required: [lat, lng], properties: { lat: { type: number }, lng: { type: number }, at: { type: string, format: date-time } } } } } }, responses: { '204': { description: OK } } } }
  /c/offers: { get: { summary: پیشنهادهای نزدیک (فقط محله), responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Offer' } } } } } } } }
  /c/offers/{id}/accept: { post: { summary: پذیرش اتمیک, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: سفارش کامل با آدرس و تلفن, content: { application/json: { schema: { $ref: '#/components/schemas/ActiveOrder' } } } }, '409': { description: پیک دیگری برداشت یا منقضی شد } } } }
  /c/offers/{id}/reject: { post: { summary: رد, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '204': { description: OK } } } }
  /c/orders/active: { get: { summary: سفارش در جریان, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ActiveOrder' } } } }, '204': { description: ندارد } } } }
  /c/orders/{id}/stage: { post: { summary: رفتن به مرحله‌ی بعد, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { type: object, required: [stage], properties: { stage: { type: string, enum: [pickup, toCust, handover] }, checkedItems: { type: array, items: { type: string } } } } } } }, responses: { '200': { description: OK } } } }
  /c/orders/{id}/withdraw: { post: { summary: انصراف (فقط قبل از تحویل‌گیری), requestBody: { content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '204': { description: OK }, '409': { description: دیگر ممکن نیست } } } }
  /c/orders/{id}/issue: { post: { summary: گزارش مشکل سفارش, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }, responses: { '204': { description: OK } } } }
  /c/orders/{id}/unreachable: { post: { summary: مشتری در دسترس نیست (گزارش به مدیر شهر), parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '204': { description: OK } } } }
  /c/orders/{id}/deliver: { post: { summary: تحویل شد, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { type: object, properties: { cashCollected: { type: integer, minimum: 0 } } } } } }, responses: { '200': { description: خلاصه, content: { application/json: { schema: { type: object, properties: { earn: { type: integer }, cashMismatch: { type: boolean } } } } } } } } }
  /c/orders/history: { get: { summary: تاریخچه, parameters: [{ name: cursor, in: query, schema: { type: string } }], responses: { '200': { description: OK } } } }
  /c/earnings: { get: { summary: درآمد, parameters: [{ name: period, in: query, schema: { type: string, enum: [today, week, month] } }], responses: { '200': { description: 'total, trips, hours, avg, balance, cashHeld, chart' } } } }
  /c/settlements: { get: { summary: تسویه‌ها, responses: { '200': { description: OK } } } }
  /c/sheba-change: { post: { summary: درخواست تغییر شبا (OTP تازه + بررسی مدیر), responses: { '202': { description: OK } } } }
  /c/consent: { put: { summary: ذخیره‌ی انتخاب کوکی, requestBody: { content: { application/json: { schema: { type: object, properties: { performance: { type: boolean }, analytics: { type: boolean } } } } } }, responses: { '204': { description: OK } } } }
components:
  securitySchemes: { bearer: { type: http, scheme: bearer } }
  schemas:
    Me: { type: object, properties: { name: { type: string }, phone: { type: string }, status: { type: string, enum: [pending, approved, suspended] }, docs: { type: array, items: { type: object, properties: { type: { type: string }, status: { type: string, enum: [ok, wait, bad] }, expiresAt: { type: string, format: date } } } } } }
    DocType: { type: object, properties: { id: { type: string }, label: { type: string }, sub: { type: string }, required: { type: boolean } } }
    Offer: { type: object, properties: { id: { type: string }, rest: { type: string }, fromArea: { type: string }, toArea: { type: string }, km: { type: number }, kmToRest: { type: number }, minutes: { type: integer }, earn: { type: integer }, cash: { type: boolean }, expiresAt: { type: string, format: date-time } } }
    ActiveOrder: { type: object, properties: { id: { type: string }, no: { type: integer }, stage: { type: string, enum: [toRest, pickup, toCust, handover, done] }, rest: { type: string }, restAddress: { type: string }, restPhone: { type: string }, cust: { type: string }, custAddress: { type: string }, custPhone: { type: string }, note: { type: string }, items: { type: array, items: { type: object, properties: { id: { type: string }, q: { type: integer }, name: { type: string }, opt: { type: string } } } }, cash: { type: boolean }, due: { type: integer }, earn: { type: integer } } }
