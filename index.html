<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E4501E" />
    <meta name="description" content="سفارش آنلاین غذا از رستوران‌های شهر شما" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="دکون" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>دکون</title>
    <script>
      // Theme before first paint (no flash): saved choice in dk-theme, else follow the phone.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('dk-theme');
        } catch (e) {}
        var dark =
          t === 'dark' ||
          (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        // iPhone/iPad Safari zooms into fields with text under 16px; styles read the .ios class.
        var ua = navigator.userAgent;
        if (
          /iPhone|iPad|iPod/.test(ua) ||
          (/Macintosh/.test(ua) && (navigator.maxTouchPoints > 0 || 'ontouchend' in document))
        )
          document.documentElement.classList.add('ios');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>برای استفاده از دکون، جاوااسکریپت مرورگر را فعال کنید.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
