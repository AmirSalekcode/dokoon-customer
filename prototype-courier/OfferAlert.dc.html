<x-dc>
<helmet>
<style>
@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:300;font-display:swap;src:url(/_blob/15b2679c8bfbb2516de3b480f9ed0bc5) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:400;font-display:swap;src:url(/_blob/6259b89db67d4999e322333ec185b1d2) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:500;font-display:swap;src:url(/_blob/069abf44dcbbfd0bfaeabfacfae55286) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:700;font-display:swap;src:url(/_blob/2c986bbf39699216ea3d18c33a6fd79e) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:800;font-display:swap;src:url(/_blob/92c5107a23f687f46f7f419a6489f113) format('truetype')}
.OA_r{font-family:'Yekan Bakh',Tahoma,sans-serif;position:relative;width:100%;height:100%;min-height:844px;padding:32px 16px 16px;display:flex;flex-direction:column;gap:16px;background:linear-gradient(170deg,#8B2313,#C2410C 45%,#E4501E);color:#fff;overflow:hidden}
.OA_r *{box-sizing:border-box}
.OA_hd{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}.OA_hd h1{margin:0;font-size:24px;font-weight:800}.OA_hd p{margin:0;font-size:14px;opacity:.92}
.OA_ic{position:relative;width:72px;height:72px;border-radius:50%;background:#fff;color:#C2410C;display:grid;place-items:center;margin-bottom:8px}
.OA_ic svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;animation:OA_b 1s ease-in-out infinite}
.OA_g{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.7);animation:OA_p 2s ease-out infinite}.OA_g+.OA_g{animation-delay:1s}
@keyframes OA_p{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.2);opacity:0}}@keyframes OA_b{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.OA_tm{align-self:center;position:relative;width:112px;height:112px}.OA_tm svg{width:112px;height:112px;transform:rotate(-90deg)}.OA_tm circle{fill:none;stroke-width:8;stroke-linecap:round}
.OA_k{stroke:rgba(255,255,255,.25)}.OA_pg{stroke:#fff;transition:stroke-dashoffset 1s linear}
.OA_tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-weight:800;line-height:1.2}.OA_tt small{font-size:12px;font-weight:500}
.OA_cd{background:var(--sf,#fff);color:var(--ink,#1F1A17);border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 32px rgba(0,0,0,.25)}
.OA_e{display:flex;align-items:center;justify-content:space-between}.OA_e small{font-size:12px;color:var(--mu,#7A6E66)}.OA_e b{font-size:24px;font-weight:800;color:var(--pr2,#C2410C)}
.OA_rt{display:flex;gap:12px}.OA_d{display:flex;flex-direction:column;align-items:center;padding-top:6px}.OA_d i{width:12px;height:12px;border-radius:50%;background:#E4501E}.OA_d u{width:2px;height:32px;background:var(--ln,#F0DFD0)}.OA_d i+u+i{background:#1F1A17}
.OA_t{flex:1;font-size:15px;font-weight:700;line-height:1.7}.OA_t small{display:block;font-size:12px;font-weight:400;color:var(--mu,#7A6E66)}
.OA_m{display:flex;gap:8px;flex-wrap:wrap}.OA_m span{height:28px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:700;line-height:28px;background:var(--bg,#FBF0E6)}.OA_m .OA_c{background:var(--soft,#FCE3D0);color:var(--pr2,#C2410C)}
.OA_bt{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.OA_ok{font-family:'Yekan Bakh',Tahoma,sans-serif;height:64px;border:0;border-radius:999px;background:#fff;color:#8B2313;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.OA_no{font-family:'Yekan Bakh',Tahoma,sans-serif;height:52px;border:2px solid rgba(255,255,255,.7);border-radius:999px;background:transparent;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.OA_ok:focus-visible,.OA_no:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</helmet>
<section class="OA_r" dir="rtl" aria-label="سفارش جدید"><div class="OA_hd"><div class="OA_ic"><span class="OA_g"></span><span class="OA_g"></span><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7M7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path></svg></div><h1>سفارش جدید برای شما</h1><p>{{ rest }}</p></div><div class="OA_tm"><svg viewBox="0 0 128 128" aria-hidden="true"><circle class="OA_k" cx="64" cy="64" r="54"></circle><circle class="OA_pg" cx="64" cy="64" r="54" stroke-dasharray="339.29" stroke-dashoffset="{{ dash }}"></circle></svg><div class="OA_tt"><span>{{ timerText }}</span><small>ثانیه</small></div></div><div class="OA_cd"><div class="OA_e"><small>درآمد این سفارش</small><b>{{ earn }}</b></div><div class="OA_rt"><div class="OA_d"><i></i><u></u><i></i></div><div class="OA_t"><div>{{ from }}<small>تحویل از رستوران · {{ d1 }}</small></div><div style="margin-top:12px">{{ to }}<small>تحویل به مشتری · {{ d2 }}</small></div></div></div><div class="OA_m"><span>{{ dist }}</span><span class="{{ payCls }}">{{ pay }}</span></div></div><div class="OA_bt"><button class="OA_ok" onClick="{{ accept }}">قبول سفارش</button><button class="OA_no" onClick="{{ reject }}">رد کردن</button></div></section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"offer": {"editor": null}, "timerText": {"editor": null}, "progress": {"editor": null}, "onAccept": {"editor": null}, "onReject": {"editor": null}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
const o = P.offer || {};
const pr = typeof P.progress === 'number' ? Math.max(0, Math.min(1, P.progress)) : 1;
return { rest: o.rest ?? '', earn: o.earn ?? '', from: o.from ?? '', to: o.to ?? '', d1: o.d1 ?? '', d2: o.d2 ?? '', dist: o.dist ?? '', pay: o.pay ?? '', payCls: o.cash ? 'OA_c' : '', timerText: P.timerText ?? '', dash: 339.29 * (1 - pr), accept: () => { if (P.onAccept) P.onAccept(); }, reject: () => { if (P.onReject) P.onReject(); } };
}
}
</script>
