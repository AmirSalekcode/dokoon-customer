<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>نوار اقدام</title>

</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:300;font-display:swap;src:url(/_blob/15b2679c8bfbb2516de3b480f9ed0bc5) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:400;font-display:swap;src:url(/_blob/6259b89db67d4999e322333ec185b1d2) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:500;font-display:swap;src:url(/_blob/069abf44dcbbfd0bfaeabfacfae55286) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:700;font-display:swap;src:url(/_blob/2c986bbf39699216ea3d18c33a6fd79e) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:800;font-display:swap;src:url(/_blob/92c5107a23f687f46f7f419a6489f113) format('truetype')}
.ActionBar_ab{padding:12px 16px 16px;background:var(--sf,#fff);border-radius:28px 28px 0 0;box-shadow:0 -8px 24px rgba(31,26,23,.12);font-family:'Yekan Bakh',Tahoma,sans-serif;}.ActionBar_bt{display:flex;align-items:center;justify-content:space-between;width:100%;height:56px;border:0;border-radius:999px;background:#E4501E;color:#fff;padding:0 24px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(228,80,30,.25);transition:transform .2s ease-out}.ActionBar_bt:hover{transform:scale(1.02)}.ActionBar_bt:focus-visible{outline:3px solid #1F1A17;outline-offset:2px}.ActionBar_bt:disabled{background:var(--ln,#F0DFD0);color:var(--mu,#7A6E66);box-shadow:none;cursor:not-allowed;justify-content:center}.ActionBar_bt span:last-child{font-weight:800}
</style>
</helmet>
<div class="ActionBar_ab" dir="rtl"><button class="ActionBar_bt" disabled="{{ off }}" onClick="{{ tap }}"><span>{{ label }}</span><sc-if value="{{ hasValue }}" hint-placeholder-val="{{ true }}"><span>{{ valueText }}</span></sc-if></button></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label": {"editor": null}, "valueText": {"editor": null}, "disabled": {"editor": null}, "onTap": {"editor": null}, "$preview": {"width": 390, "height": 88}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
return { label: P.label ?? '', valueText: P.valueText ?? '', hasValue: !!P.valueText && !P.disabled, off: !!P.disabled, tap: (e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); if(P.onTap) P.onTap(); } };
}
}
</script>
</body>
</html>
