<!doctype html>

<title>خلاصه‌ی سفارش تحویل‌شده</title>

</head>

<x-dc>
<helmet>
<style>
@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:300;font-display:swap;src:url(/_blob/15b2679c8bfbb2516de3b480f9ed0bc5) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:400;font-display:swap;src:url(/_blob/6259b89db67d4999e322333ec185b1d2) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:500;font-display:swap;src:url(/_blob/069abf44dcbbfd0bfaeabfacfae55286) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:700;font-display:swap;src:url(/_blob/2c986bbf39699216ea3d18c33a6fd79e) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:800;font-display:swap;src:url(/_blob/92c5107a23f687f46f7f419a6489f113) format('truetype')}
.TS2_c{font-family:'Yekan Bakh',Tahoma,sans-serif;background:var(--sf,#fff);color:var(--ink,#1F1A17);border-radius:28px;padding:24px 16px 16px;box-shadow:0 4px 16px rgba(31,26,23,.06);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.TS2_a{width:96px;height:96px;filter:drop-shadow(0 8px 8px rgba(120,50,10,.3));animation:TS2_f 4.5s ease-in-out infinite}@keyframes TS2_f{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.TS2_c h2{margin:0;font-size:20px;font-weight:800}.TS2_e{font-size:32px;font-weight:800;color:var(--pr2,#C2410C);line-height:1.4}.TS2_c small{color:var(--mu,#7A6E66);font-size:12px}
.TS2_r{width:100%;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--ln,#F0DFD0);padding-top:12px}.TS2_r div{display:flex;justify-content:space-between;font-size:14px}.TS2_r span{color:var(--mu,#7A6E66)}
.TS2_b{font-family:'Yekan Bakh',Tahoma,sans-serif;width:100%;height:60px;border:0;border-radius:999px;background:#E4501E;color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(228,80,30,.25)}.TS2_b:focus-visible{outline:3px solid #1F1A17;outline-offset:2px}
</style>
</helmet>
<div class="TS2_c" dir="rtl"><svg class="TS2_a" viewBox="0 0 100 100" aria-hidden="true"><use href="#dk-cake"></use></svg><h2>سفارش تحویل شد، دست شما درد نکند</h2><div class="TS2_e">{{ earn }}</div><small>به درآمد امروز اضافه شد</small><div class="TS2_r"><sc-for list="{{ rows }}" as="r" hint-placeholder-count="3"><div><span>{{ r.label }}</span><b>{{ r.value }}</b></div></sc-for></div><button class="TS2_b" onClick="{{ done }}">بازگشت به سفارش‌ها</button></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"earn": {"editor": null}, "rows": {"editor": null}, "onDone": {"editor": null}, "$preview": {"width": 358, "height": 360}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
return { earn: P.earn ?? '', rows: P.rows || [], done: () => { if (P.onDone) P.onDone(); } };
}
}
</script>
</body>
</html>
