<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>کارت سفارش موجود</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:300;font-display:swap;src:url(/_blob/15b2679c8bfbb2516de3b480f9ed0bc5) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:400;font-display:swap;src:url(/_blob/6259b89db67d4999e322333ec185b1d2) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:500;font-display:swap;src:url(/_blob/069abf44dcbbfd0bfaeabfacfae55286) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:700;font-display:swap;src:url(/_blob/2c986bbf39699216ea3d18c33a6fd79e) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:800;font-display:swap;src:url(/_blob/92c5107a23f687f46f7f419a6489f113) format('truetype')}
.OF_c{font-family:'Yekan Bakh',Tahoma,sans-serif;width:100%;border:0;text-align:right;background:var(--sf,#fff);color:var(--ink,#1F1A17);border-radius:20px;padding:16px;box-shadow:0 4px 16px rgba(31,26,23,.06);display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:transform .2s ease-out}
.OF_c:hover{transform:scale(1.01)}.OF_c:focus-visible{outline:3px solid #E4501E;outline-offset:2px}
.OF_h{display:flex;align-items:center;gap:8px}.OF_h b{flex:1;font-size:16px;font-weight:800;line-height:1.5}
.OF_e{font-size:20px;font-weight:800;color:var(--pr2,#C2410C)}
.OF_r{display:flex;gap:12px;align-items:flex-start}.OF_d{display:flex;flex-direction:column;align-items:center;gap:0;padding-top:6px}
.OF_d i{width:12px;height:12px;border-radius:50%;background:#E4501E}.OF_d u{width:2px;height:24px;background:var(--ln,#F0DFD0)}.OF_d i+u+i{background:#1F1A17}
.OF_t{flex:1;font-size:14px;line-height:1.7}.OF_t small{display:block;font-size:12px;color:var(--mu,#7A6E66)}
.OF_m{display:flex;gap:8px;flex-wrap:wrap}.OF_m span{height:28px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:700;line-height:28px;background:var(--bg,#FBF0E6);color:var(--ink,#1F1A17)}
.OF_m .OF_cash{background:var(--soft,#FCE3D0);color:var(--pr2,#C2410C)}
</style>
</helmet>
<button class="OF_c" dir="rtl" onClick="{{ open }}" aria-label="مشاهده سفارش از {{ rest }}"><div class="OF_h"><b>{{ rest }}</b><span class="OF_e">{{ earn }}</span></div><div class="OF_r"><div class="OF_d"><i></i><u></u><i></i></div><div class="OF_t"><div>{{ from }}<small>مبدأ</small></div><div style="margin-top:8px">{{ to }}<small>مقصد</small></div></div></div><div class="OF_m"><span>{{ dist }}</span><span>{{ time }}</span><span class="{{ payCls }}">{{ pay }}</span></div></button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"offer": {"editor": null}, "onOpen": {"editor": null}, "$preview": {"width": 358, "height": 230}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
const o = P.offer || {};
return { rest: o.rest ?? '', earn: o.earn ?? '', from: o.from ?? '', to: o.to ?? '', dist: o.dist ?? '', time: o.time ?? '', pay: o.pay ?? '', payCls: o.cash ? 'OF_cash' : '', open: () => { if (P.onOpen) P.onOpen(); } };
}
}
</script>
</body>
</html>
