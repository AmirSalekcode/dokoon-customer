.HI_r{font-family:'Yekan Bakh',Tahoma,sans-serif;width:100%;border:0;text-align:right;background:var(--sf,#fff);color:var(--ink,#1F1A17);border-radius:20px;padding:12px 16px;box-shadow:0 4px 16px rgba(31,26,23,.06);display:flex;align-items:center;gap:12px;cursor:pointer;min-height:72px}.HI_r:focus-visible{outline:3px solid #E4501E;outline-offset:2px}

<button class="HI_r" dir="rtl" onClick="{{ tap }}"><span class="HI_t"><b>{{ title }}</b><small>{{ sub }}</small></span><span class="HI_e">{{ earn }}<span>{{ pay }}</span></span></button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"order": {"editor": null}, "onTap": {"editor": null}, "$preview": {"width": 358, "height": 88}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
const o = P.order || {};
return { title: o.title ?? '', sub: o.sub ?? '', earn: o.earn ?? '', pay: o.pay ?? '', tap: () => { if (P.onTap) P.onTap(); } };
}
}
</script>
