<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>کارت مجوز دستگاه</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:300;font-display:swap;src:url(/_blob/15b2679c8bfbb2516de3b480f9ed0bc5) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:400;font-display:swap;src:url(/_blob/6259b89db67d4999e322333ec185b1d2) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:500;font-display:swap;src:url(/_blob/069abf44dcbbfd0bfaeabfacfae55286) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:700;font-display:swap;src:url(/_blob/2c986bbf39699216ea3d18c33a6fd79e) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:800;font-display:swap;src:url(/_blob/92c5107a23f687f46f7f419a6489f113) format('truetype')}
.PM_c{font-family:'Yekan Bakh',Tahoma,sans-serif;background:var(--sf,#fff);color:var(--ink,#1F1A17);border-radius:20px;padding:16px;box-shadow:0 4px 16px rgba(31,26,23,.06);display:flex;flex-direction:column;gap:12px}
.PM_h{display:flex;align-items:center;gap:12px}.PM_i{width:48px;height:48px;flex:none;border-radius:50%;background:var(--soft,#FCE3D0);color:var(--pr2,#C2410C);display:grid;place-items:center}.PM_i svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.PM_h b{flex:1;font-size:16px;font-weight:800}.PM_s{height:28px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:800;line-height:28px;background:var(--bg,#FBF0E6);color:var(--mu,#7A6E66)}.PM_on{background:#1F1A17;color:#fff}
.PM_c p{margin:0;font-size:14px;line-height:1.8;color:var(--mu,#7A6E66)}
.PM_g{font-family:'Yekan Bakh',Tahoma,sans-serif;height:52px;border:0;border-radius:999px;background:#E4501E;color:#fff;font-size:14px;font-weight:800;cursor:pointer}.PM_g:focus-visible{outline:3px solid #1F1A17;outline-offset:2px}
</style>
</helmet>
<div class="PM_c" dir="rtl"><div class="PM_h"><span class="PM_i"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="{{ d }}"></path></svg></span><b>{{ title }}</b><span class="PM_s {{ cls }}">{{ stateText }}</span></div><p>{{ text }}</p><sc-if value="{{ needs }}" hint-placeholder-val="{{ true }}"><button class="PM_g" onClick="{{ grant }}">{{ cta }}</button></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"perm": {"editor": null}, "onGrant": {"editor": null}, "$preview": {"width": 358, "height": 168}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
const p = P.perm || {};
return { title: p.title ?? '', text: p.text ?? '', d: p.d ?? '', cta: p.cta ?? 'اجازه می‌دهم', needs: !p.granted, stateText: p.granted ? 'فعال' : 'لازم است', cls: p.granted ? 'PM_on' : '', grant: () => { if (P.onGrant) P.onGrant(); } };
}
}
</script>
</body>
</html>
