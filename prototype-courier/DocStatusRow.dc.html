<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>وضعیت مدرک</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:300;font-display:swap;src:url(/_blob/15b2679c8bfbb2516de3b480f9ed0bc5) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:400;font-display:swap;src:url(/_blob/6259b89db67d4999e322333ec185b1d2) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:500;font-display:swap;src:url(/_blob/069abf44dcbbfd0bfaeabfacfae55286) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:700;font-display:swap;src:url(/_blob/2c986bbf39699216ea3d18c33a6fd79e) format('truetype')}@font-face{font-family:'Yekan Bakh';font-style:normal;font-weight:800;font-display:swap;src:url(/_blob/92c5107a23f687f46f7f419a6489f113) format('truetype')}
.DS_r{font-family:'Yekan Bakh',Tahoma,sans-serif;background:var(--sf,#fff);color:var(--ink,#1F1A17);border-radius:20px;padding:12px 16px;box-shadow:0 4px 16px rgba(31,26,23,.06);display:flex;align-items:center;gap:12px;min-height:72px}
.DS_t{flex:1;min-width:0}.DS_t b{display:block;font-size:15px;font-weight:700;line-height:1.6}.DS_t small{display:block;font-size:12px;color:var(--mu,#7A6E66)}
.DS_b{height:28px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:800;line-height:28px;background:var(--bg,#FBF0E6);color:var(--ink,#1F1A17);flex:none}.DS_ok{background:#1F1A17;color:#fff}.DS_wait{background:#F5B32F;color:#1F1A17}.DS_bad{background:#C8281E;color:#fff}
.DS_a{font-family:'Yekan Bakh',Tahoma,sans-serif;height:44px;padding:0 16px;border:2px solid #E4501E;border-radius:999px;background:none;color:var(--pr2,#C2410C);font-size:12px;font-weight:800;cursor:pointer;flex:none}.DS_a:focus-visible{outline:3px solid #1F1A17;outline-offset:2px}
</style>
</helmet>
<div class="DS_r" dir="rtl"><div class="DS_t"><b>{{ label }}</b><small>{{ sub }}</small></div><span class="DS_b {{ cls }}">{{ statusLabel }}</span><sc-if value="{{ canRenew }}" hint-placeholder-val="{{ false }}"><button class="DS_a" onClick="{{ renew }}">بارگذاری مجدد</button></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"doc": {"editor": null}, "onRenew": {"editor": null}, "$preview": {"width": 358, "height": 88}}'>
class Component extends DCLogic {
renderVals() {
const P = this.props;
const d = P.doc || {};
return { label: d.label ?? '', sub: d.sub ?? '', statusLabel: d.statusLabel ?? '', cls: 'DS_' + (d.status || 'ok'), canRenew: !!d.canRenew, renew: () => { if (P.onRenew) P.onRenew(); } };
}
}
</script>
</body>
</html>
